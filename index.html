    /* ---------- responsive ---------- */
    @media (max-width: 980px) {
      :root { --sec: 80px; }
      .hero-grid { grid-template-columns: 1fr !important; gap: 36px !important; padding-top: 56px !important; padding-bottom: 64px !important; }
      .hero-visual { min-height: 340px !important; order: -1; }
      .hero-h1 { font-size: 52px !important; letter-spacing: -1.6px !important; }
      .showcase-row { grid-template-columns: 1fr !important; gap: 32px !important; }
      .pain-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .showcase-row .showcase-copy { order: 2 !important; }
      .bento-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .bento-cell:first-child { grid-column: span 2 !important; grid-row: auto !important; }
      .bento-cell.bento-stats { grid-column: span 2 !important; }
      .faq-wrap { grid-template-columns: 1fr !important; gap: 32px !important; }
      .faq-head { position: static !important; }
      .footer-news { grid-template-columns: 1fr !important; gap: 24px !important; }
      .news-form { justify-self: start !important; }
      .testi-grid { grid-template-columns: 1fr !important; }
      .how-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
      .mosaic-grid { grid-template-columns: 1fr !important; }
      .mosaic-hero { min-height: 440px !important; }
    }
    @media (max-width: 720px) {
      :root { --gutter: 22px; }
      .nav-links, .nav-cart { display: none !important; }
      .nav-burger { display: inline-flex !important; }
      .hero-h1 { font-size: 42px !important; }
      .section-h { font-size: 32px !important; }
      .big-quote { font-size: 24px !important; }
      .atmos-h { font-size: 32px !important; }
      .bento-grid { grid-template-columns: 1fr !important; }
      .pain-grid { grid-template-columns: 1fr !important; }
      .bento-cell:first-child, .bento-cell.bento-stats { grid-column: auto !important; }
      .bento-stats { gap: 18px !important; }
      .footer-cols { grid-template-columns: 1fr 1fr !important; }
    }
  </style>

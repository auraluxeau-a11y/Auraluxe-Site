<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; background: var(--canvas); }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-family: var(--font-body); color: var(--ink); }
a { color: var(--link-blue); }
a:hover { color: var(--link-blue-pressed); }
::selection { background: var(--brand-purple-300); }
:root { --gutter: 40px; --sec: 104px; --accent: #7793C7; --accent-deep: #4a659e; }

@keyframes auraDrift  { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-24px,20px) scale(1.05); } }
@keyframes auraDrift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(22px,-18px) scale(1.06); } }
@keyframes auraPulse  { 0%,100% { opacity: .82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
.aura-drift  { animation: auraDrift  17s ease-in-out infinite; }
.aura-drift2 { animation: auraDrift2 20s ease-in-out infinite; }
.aura-pulse  { animation: auraPulse  8s  ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .aura-drift,.aura-drift2,.aura-pulse,.how-sun { animation: none; } }

@keyframes auraReveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.aura-reveal { animation: auraReveal .7s cubic-bezier(.22,1,.36,1) both; }
@supports (animation-timeline: view()) {
  .aura-reveal { animation-name: auraReveal; animation-timeline: view(); animation-range: entry 2% entry 32%; animation-duration: auto; }
}
@media (prefers-reduced-motion: reduce) { .aura-reveal { animation: none !important; opacity: 1 !important; transform: none !important; } }

@keyframes wavePulse { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }

@keyframes lineFill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.how-line-fill { animation: lineFill 1.1s ease both; }
@supports (animation-timeline: view()) {
  .how-line-fill { animation-name: lineFill; animation-timeline: view(); animation-range: entry 10% cover 60%; animation-duration: auto; }
}

@keyframes sunRise { 0% { bottom: -6px; opacity: .5; } 100% { bottom: 82px; opacity: 1; } }
.how-sun { animation: sunRise 5s cubic-bezier(.4,0,.2,1) infinite alternate; }

.nav-link:hover { color: var(--ink); }

@media (max-width: 900px) {
  body { --sec: 72px; }
  .how-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
  .how-visual { order: 1 !important; }
  .how-copy { order: 2 !important; }
}
@media (max-width: 720px) {
  body { --gutter: 20px; --sec: 64px; }
  .nav-cta-wrap { display: none !important; }
  .how-step-marker { display: none !important; }
  .how-journey-row { gap: 0 !important; }
  .how-journey-row > div:last-child { padding-bottom: 56px !important; }
  .evening-timeline { margin-top: 40px !important; }
  .evening-timeline > div:first-child { display: none !important; }
  .evening-timeline > div:last-child { grid-template-columns: 1fr 1fr !important; row-gap: 28px !important; }
  .how-step3 { padding: 44px 22px !important; }
}
@media (max-width: 420px) {
  .aura-hero-display { font-size: 38px !important; letter-spacing: -1.2px !important; }
}
</style>
